<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Assistant</title>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="page-wrapper">
      <!------- Header / Branding ------->
      <header class="site-header">
        <!-- Use the correct path to the logo in the img folder -->
        <img src="img/Loreal-logo.png" alt="L'Oréal Logo" class="site-logo">
        <h1 class="site-title">Advisor</h1>
      </header>

      <!------- Chat Area ------->
      <main>
        <section class="chatbox">
          <!-- Fullscreen and resize controls -->
          <div class="chat-controls">
            <button type="button" id="fullscreenBtn" title="Fullscreen">
              <span class="material-icons">fullscreen</span>
            </button>
            <button type="button" id="resizeBtn" title="Resize Chat">
              <span class="material-icons">zoom_out_map</span>
            </button>
          </div>
          <div id="chatWindow" class="chat-window">
            <!-- messages will be appended here via JS -->
          </div>

          <form id="chatForm" class="chat-form">
            <label for="userInput" class="visually-hidden">Message</label>
            <input
              id="userInput"
              name="userInput"
              type="text"
              placeholder="Ask me about products or routines…"
              autocomplete="off"
              required
            />
            <button type="submit" id="sendBtn">
              <span class="material-icons">send</span>
              <span class="visually-hidden">Send</span>
            </button>
          </form>
        </section>
      </main>

      <!------- Footer Links ------->
      <footer class="site-footer">
        <p>&copy; 2025 Company Name. All rights reserved.</p>
        <nav>
          <!-- These URLs are placeholders -->
          <a href="#">Privacy Policy</a>
          <a href="#">Terms of Use</a>
          <a href="#">Contact</a>
        </nav>
      </footer>

      <!------- Color Sections in Footer ------->
      <footer class="site-footer">
        <div class="footer-col iconic-black">
          <span class="color-main geometric-sans">ICONIC</span>
          <span class="color-sub serif-font"><strong>black</strong></span>
        </div>
        <div class="footer-col radiant-white">
          <span class="color-main geometric-sans">RADIANT</span>
          <span class="color-sub serif-font"><strong>white</strong></span>
        </div>
        <div class="footer-col passionate-red">
          <span class="color-main geometric-sans">PASSIONATE</span>
          <span class="color-sub serif-font"><strong>red</strong></span>
        </div>
        <div class="footer-col eternal-gold">
          <span class="color-main geometric-sans">ETERNAL</span>
          <span class="color-sub serif-font"><strong>gold</strong></span>
        </div>
      </footer>
    </div>

    <!-- secrets.js can be removed when using Cloudflare Workers for API requests -->
    <script src="secrets.js"></script>
    <script src="script.js"></script>
  </body>
</html>
